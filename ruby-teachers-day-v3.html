<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruby Ma'am ka Surprise Exam | by Ammar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌹</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--rose:#ffd9e2;--blush:#fff3f6;--wine:#6e1f3d;--hot:#e8456f;--hot2:#c92f59;--gold:#f4c46a;--board:#2f4a41}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Quicksand','Trebuchet MS',system-ui,sans-serif;color:var(--wine);background:linear-gradient(160deg,#ffd1dc,#ffe9ef 45%,#ffe0c9);background-attachment:fixed;overflow-x:hidden;padding-bottom:40px}
h1,h2,.btn{font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif}
#petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#petals span{position:absolute;bottom:-60px;opacity:.55;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(30deg)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
.tap{position:fixed;pointer-events:none;z-index:80;font-size:16px;animation:fade .9s forwards}
@keyframes fade{to{opacity:0;transform:translateY(-14px) scale(.6)}}
header{position:sticky;top:0;z-index:20;padding:8px 10px 0}
.hd{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mono,.hr{background:rgba(255,255,255,.88);border:2px solid #fff;border-radius:99px;padding:5px 12px;font-weight:700;font-size:13px;box-shadow:0 3px 0 rgba(232,69,111,.25);display:flex;align-items:center;gap:8px}
.mono{font-family:'Dancing Script',cursive;font-size:18px;color:var(--hot2)}.mono b{color:var(--hot)}
.ic{border:0;background:transparent;cursor:pointer;font-size:15px;padding:0}
#prog{height:8px;max-width:600px;margin:6px auto 0;background:rgba(255,255,255,.6);border-radius:9px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--hot);transition:width .5s;border-radius:9px}
#wrap{position:relative;z-index:2;max-width:600px;margin:26px auto 0;padding:0 16px}
.card{position:relative;background:var(--blush);border-radius:30px;padding:26px 20px 24px;text-align:center;box-shadow:0 8px 0 rgba(232,69,111,.28),0 20px 40px rgba(120,40,70,.16);border:4px solid #fff;animation:in .5s}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.97)}}
.board{background:var(--board);color:#fff;border:6px solid #b98a5a;border-radius:14px;padding:12px 14px;margin:6px 0 16px;box-shadow:inset 0 0 20px rgba(0,0,0,.35)}
.board h2{margin:2px 0 4px;font-size:clamp(20px,5.4vw,26px);line-height:1.2}
.board .sub{margin:0;font-size:14px;opacity:.9;font-weight:700}
.tag{display:inline-block;background:var(--gold);color:var(--wine);font-weight:800;font-size:12px;border-radius:99px;padding:3px 12px;margin-bottom:6px}
.eyebrow{margin:0 0 4px;font-weight:800;color:var(--hot2);font-size:13px}
h1{font-family:'Dancing Script','Baloo 2',cursive;font-size:clamp(36px,10vw,54px);line-height:1.05;margin:6px 0 10px;color:var(--hot2)}
.sub{margin:0 0 14px;font-weight:700;opacity:.85;font-size:15px}
.rule{display:none}
.emoji{font-size:50px;display:block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.btn{border:0;border-radius:99px;padding:12px 22px;font-size:18px;font-weight:800;cursor:pointer;color:var(--wine);transition:transform .15s,box-shadow .15s}
.main{background:linear-gradient(180deg,#ff8aa9,var(--hot));color:#fff;box-shadow:0 5px 0 #b82a52;margin:8px 4px}
.main:active{box-shadow:0 1px 0 #b82a52;transform:translateY(4px)}.main:disabled{opacity:.55}
.opt{display:block;width:100%;margin:10px 0;background:#fff;border:3px solid var(--rose);box-shadow:0 4px 0 var(--rose);font-size:17px}
.opt:hover:not(:disabled){transform:translateY(-2px) rotate(-.6deg);border-color:var(--hot)}
.opt:disabled{opacity:.6;cursor:default}
.btn:focus-visible,.ic:focus-visible{outline:3px solid #7a5cff;outline-offset:2px}
#roast{margin-top:14px;background:#fff0c9;border-radius:20px;padding:0;font-weight:700;font-size:15px;text-align:left;overflow:hidden;max-height:0}
#roast.pop{padding:12px 16px;max-height:360px;animation:wob .5s;border:3px dashed var(--gold)}
@keyframes wob{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.big{position:relative;height:34px;border-radius:99px;background:#f6d3dc;overflow:hidden;margin:8px 0 14px;border:3px solid #fff}
.big i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ff9ab5,var(--hot));transition:width .25s}
.big span{position:relative;font-weight:800;line-height:28px;font-size:14px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.val{font-size:30px;font-weight:800;color:var(--hot2);font-family:'Baloo 2',sans-serif}
input[type=range]{width:100%;accent-color:var(--hot);height:30px}
.txt{width:100%;padding:12px 16px;border-radius:99px;border:3px solid var(--rose);font:inherit;font-size:18px;text-align:center;color:var(--wine);margin-bottom:6px;background:#fff}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.tile{aspect-ratio:1;background-size:cover;background-position:center;border-radius:14px;border:4px solid var(--rose);cursor:pointer;padding:0;transition:transform .15s}
.tile.on{border-color:var(--hot);transform:scale(.9);box-shadow:0 0 0 3px var(--hot)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--rose);border-radius:18px;padding:10px 4px;font-size:12px;font-weight:700}
.stats b{display:block;font-size:26px;font-family:'Baloo 2',sans-serif;color:var(--hot2)}
.stamp{display:inline-block;border:3px double #c0392b;color:#c0392b;font:800 34px 'Baloo 2',sans-serif;padding:0 16px;border-radius:8px;transform:rotate(-6deg);margin:4px 0 8px;animation:stp .6s}
@keyframes stp{from{transform:scale(2.4) rotate(-6deg);opacity:0}}
.letter{position:relative;text-align:left;margin:30px 0 8px;padding:34px 18px 20px;border-radius:22px;background:#fff;border:3px solid var(--rose);box-shadow:0 6px 0 var(--rose)}
.seal{position:absolute;top:-24px;left:50%;transform:translateX(-50%);width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff6b8c,#c92f59);color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 4px 8px rgba(0,0,0,.25)}
.meta{font-size:12px;font-weight:800;color:var(--hot2);text-align:center;margin-bottom:6px}
.gal{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:12px 0}
.pol{background:#fff;padding:8px 8px 4px;box-shadow:0 6px 16px rgba(0,0,0,.2);width:46%;transform:rotate(-3deg);border-radius:4px;text-align:center}
.pol:nth-child(even){transform:rotate(3deg)}.pol.w{width:62%}
.pol img{width:100%;display:block;border-radius:2px}
.pol i{display:block;font:700 18px 'Dancing Script',cursive;color:var(--hot2);padding:4px 0}
.hand{font-weight:700;font-size:16px;line-height:1.65;white-space:pre-line;margin:10px 0}
.sign{font:700 34px 'Dancing Script',cursive;color:var(--hot2);text-align:right;margin-top:6px}
.ps{font-weight:700;font-size:14px;opacity:.8;margin-top:6px}
.ticket{margin:20px 0 8px;border:3px dashed var(--gold);border-radius:18px;padding:14px 10px;background:#fff9ee}
.ticket h3{font:800 22px 'Baloo 2',sans-serif;color:var(--hot2);margin:0}
.ticket p{margin:0 0 10px;font-size:13px;font-weight:700}
.menu{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.menu .btn{font-size:15px;padding:8px 14px;background:#fff;border:3px solid var(--rose)}
.pick{margin-top:12px;font-weight:800;color:var(--hot2);min-height:24px}
.small{font-size:13px;opacity:.75;margin-top:14px;font-weight:700}
.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 4px 0 var(--rose);display:block;margin:0 auto 6px}
.face{position:relative;width:min(72%,260px);margin:6px auto 10px}
.face img{width:100%;border-radius:22px;border:5px solid #fff;box-shadow:0 6px 0 var(--rose);display:block}
.face b{position:absolute;right:-10px;top:-12px;font-size:42px}
.fl{position:absolute;font-size:34px;pointer-events:none;animation:flo 1s forwards}
@keyframes flo{to{transform:translateY(-90px) scale(1.5);opacity:0}}
.acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.acts .btn{font-size:16px;padding:9px 14px;margin:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function ctx(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC;}catch(e){return null;}}

function sweep(f1,f2,d){if(!sound)return;const c=ctx();if(!c)return;try{const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.setValueAtTime(f1,c.currentTime);o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+d);g.gain.setValueAtTime(.05,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+.02);}catch(e){}}

function musicTick(){if(!music||!AC)return;while(mNext<AC.currentTime+.5){const st=mStep%PAT.length,n=PAT[st];if(n>=0)note(SC[n],mNext,.7,"triangle",.028);if(st%8===0)note(BASS[Math.floor(st/8)%4],mNext,2.3,"sine",.05);mNext+=.38;mStep++;}}
function startMusic(){if(!music||mTimer)return;const c=ctx();if(!c)return;mNext=c.currentTime+.1;mTimer=setInterval(musicTick,150);}
function stopMusic(){clearInterval(mTimer);mTimer=null;}

function loop(){cx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.vx*=.99;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);cx.restore();});P=P.filter(p=>p.y<cv.height+20);if(P.length){requestAnimationFrame(loop);}else{running=false;cx.clearRect(0,0,cv.width,cv.height);}}
